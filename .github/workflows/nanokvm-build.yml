name: nanokvm-build

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Wipe build artifacts before building (keeps dl/ cache)"
        required: false
        default: false
        type: boolean

env:
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    container: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm \
            github-cli gcc clang flex bison ccache \
            pkg-config ninja automake autoconf libtool \
            curl git bc squashfs-tools \
            rsync jq cmake openssh tree parallel \
            python3 python-pip tcl scons dtc cpio \
            fakeroot fakechroot bzr ncurses cvs file \
            mercurial unzip subversion gawk diffstat \
            texinfo chrpath socat zstd \
            confuse dosfstools mtools gettext e2fsprogs \
            which make patch perl help2man wget
          echo en_US.UTF-8 UTF-8 >> /etc/locale.gen
          locale-gen

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      # - name: ccache
      #   uses: hendrikmuhs/ccache-action@v1.2
      #   with:
      #     max-size: "10G"
      #     directory: /root/.buildroot-ccache
      #     key: archlinux-nanokvm

      # - name: Cache Buildroot downloads
      #   uses: actions/cache@v4
      #   with:
      #     path: src/buildroot/dl
      #     key: buildroot-dl-${{ github.sha }}
      #     restore-keys: |
      #       buildroot-dl-

      - name: Checkout host-tools
        uses: actions/checkout@v4
        with:
          repository: sophgo/host-tools
          path: src/host-tools
          fetch-depth: 1

      - name: Build NanoKVM image
        id: build_nanokvm
        env:
          PATH: /usr/bin/core_perl:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          cd src
          ARGS=""
          if [ "${{ inputs.clean }}" = "true" ]; then ARGS="--clean"; fi
          bash ./build-nanokvm.sh $ARGS

      - name: Show build errors
        if: ${{ failure() && steps.build_nanokvm.outcome == 'failure' }}
        run: |
          cd src
          bash ./show-build-errors.sh

      - name: Extract release version
        if: success()
        run: |
          IMG=$(ls src/install/soc_sg2002_nanokvm_sd/images/*.img | head -1)
          echo "VERSION=$(basename "$IMG" .img)" >> $GITHUB_ENV

      - name: Upload image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nanokvm-${{ env.VERSION }}
          path: |
            src/install/soc_sg2002_nanokvm_sd/images/*.img

      - name: Create GitHub release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.VERSION }}" \
            src/install/soc_sg2002_nanokvm_sd/images/*.img \
            --repo "${{ github.repository }}" \
            --title "NanoKVM ${{ env.VERSION }}" \
            --notes "Built from ${{ github.sha }}"
